apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name="${__span.tags["service.name"]}"} | trace_id = `${__trace.traceId}`'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
      spanBar:
        type: Tag
        tag: http.path

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      traceDatasourceUid: tempo
      derivedFields:
        - name: TraceID
          matcherRegex: "(?:\"TraceId\":\"|trace_id[=: ]+)([a-f0-9]{16,32})"
          datasourceUid: tempo
          urlDisplayLabel: "View Trace in Tempo"

  # Application Postgres — powers business dashboards that query domain tables
  # directly (Trainer stats). PROD MUST use a READ-ONLY DB role, NOT the app
  # superuser. OWNER-ACTION: create a read-only role + store creds in Infisical,
  # then pass GRAFANA_PG_USER / GRAFANA_PG_PASSWORD into the grafana container
  # (docker-compose.prod.yml). Until wired, this datasource resolves to empty
  # creds and stays unauthenticated. See docs/observability.md.
  - name: education-postgres
    uid: education-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $GRAFANA_PG_USER
    editable: false
    jsonData:
      database: education_platform
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $GRAFANA_PG_PASSWORD
