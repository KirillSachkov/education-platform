## RabbitMQ Prometheus exporter — per-object queue/exchange/connection metrics.
##
## Без этого `rabbitmq_queue_messages` экспортируется в global mode (одна агрегатная
## серия без label `queue`), и dashboard'ы с фильтром по конкретным queue'ам
## (`{queue=~"notifications\\..*"}`) показывают No Data. Включаем для:
##   - Notification Pipeline dashboard (issue #67)
##   - DLQ depth alerting
##   - per-queue throughput debugging
##
## Tradeoff: лишний CPU/memory на rabbitmq-prometheus при тысячах queue. Наш
## масштаб — десятки queue, нагрузка пренебрежима.
##
## Документация: https://www.rabbitmq.com/prometheus.html#metric-aggregation
prometheus.return_per_object_metrics = true
