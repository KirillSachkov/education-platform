name: Public .NET SDK
description: Install the source-pinned SDK and use only public NuGet feeds.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - shell: bash
      run: cp backend/nuget.config.ci backend/nuget.config
