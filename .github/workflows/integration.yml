name: Integration tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: [AuthService, EducationContentService, FileService, ProgressService, CommentService, TagService, NotificationService, TelegramBotService, SearchService, AccessService, AssignmentReviewService, MaterialProcessingService]
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Build local MinIO fixture from pinned public source
        if: matrix.service == 'FileService'
        run: docker build --platform linux/amd64 -f scripts/ci/minio-test.Dockerfile -t minio/minio:latest scripts/ci
      - name: Service integration suite
        env:
          SERVICE: ${{ matrix.service }}
        run: dotnet test "backend/$SERVICE/tests/$SERVICE.IntegrationTests" -c Release -maxcpucount:2 --verbosity minimal --logger 'console;verbosity=minimal'
  content-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - run: dotnet test backend/Shared/ContentAccess/ContentAccess.Tests -c Release -maxcpucount:2 --verbosity minimal --logger 'console;verbosity=minimal'
