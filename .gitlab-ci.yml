build-frontend-image:
  extends: .docker-build
  rules:
    # No `changes:` filter — merge commits в main с pre-merge release-веток
    # имеют пустой diff против ближайшего родителя, и changes:frontend/**/*
    # неожиданно skip'ает build (см. инцидент 2026-05-11: release 1.8.0
    # фронтовые фичи никогда не задеплоились, потому что merge commit на main
    # не триггернул rebuild). Frontend build ~3-5 мин — приемлемо на каждый main push.
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    # Non-secret prod build-args — hardcoded fallbacks so the job runs even
    # when GitLab CI/CD vars aren't pre-populated. Only used by `npm run build`
    # to bake NEXT_PUBLIC_* constants into the client bundle. Override via
    # project CI/CD settings if the values ever diverge from prod.
    - |
      API_URL="${NEXT_PUBLIC_API_URL:-https://sachkov-learn.net/api}"
      AUTH_ORIGIN="${NEXT_PUBLIC_AUTH_ORIGIN:-https://sachkov-learn.net}"
      APP_URL="${NEXT_PUBLIC_APP_URL:-https://sachkov-learn.net}"
      AUTHOR_SLUG="${NEXT_PUBLIC_PRIMARY_AUTHOR_SLUG:-sachkov}"
      CONSULT_LINK="${NEXT_PUBLIC_CONSULTATION_LINK:-https://t.me/sachkova_mng}"
      METRIKA_ID="${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}"
      VAPID_PUBLIC_KEY="${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}"
      docker build \
        --cache-from $CI_REGISTRY_IMAGE/frontend:latest \
        --file frontend/Dockerfile \
        --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
        --build-arg NEXT_PUBLIC_AUTH_ORIGIN="$AUTH_ORIGIN" \
        --build-arg NEXT_PUBLIC_APP_URL="$APP_URL" \
        --build-arg NEXT_PUBLIC_PRIMARY_AUTHOR_SLUG="$AUTHOR_SLUG" \
        --build-arg NEXT_PUBLIC_CONSULTATION_LINK="$CONSULT_LINK" \
        --build-arg NEXT_PUBLIC_YANDEX_METRIKA_ID="$METRIKA_ID" \
        --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
        --tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA \
        --tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA \
        --tag $CI_REGISTRY_IMAGE/frontend:latest \
        frontend
    - docker push $CI_REGISTRY_IMAGE/frontend --all-tags

prepare-release-images:
  extends: .docker-build
  stage: release
  script:
    - |
      set -e
      # Services exposed through nginx must be promoted, rolled out, and checked by
      # EXPECTED_SERVICES so prod does not pass green with a routed backend stopped.
      SERVICES="auth-service education-service file-service progress-service comment-service tag-service search-service access-service material-processing-service notification-service telegram-bot-service trainer-service assignment-review-service frontend"
      for service in $SERVICES; do
        IMAGE="$CI_REGISTRY_IMAGE/$service"
        RELEASE_IMAGE="$IMAGE:$CI_COMMIT_SHA"

        if docker manifest inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
          echo "$service already has immutable release tag $CI_COMMIT_SHA"
          continue
        fi

        echo "Promoting $service:latest to immutable release tag $CI_COMMIT_SHA"
        docker pull "$IMAGE:latest"
        docker tag "$IMAGE:latest" "$RELEASE_IMAGE"
        docker push "$RELEASE_IMAGE"
      done

# ───── DEPLOY ─────

deploy-production:
  stage: deploy
  interruptible: false
  timeout: 1h
  image: alpine:latest
  before_script:
    - *prod-ssh-route
  script:
    # Docker login on prod server (persistent Deploy Token)
    - |
      ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST \
        "echo '$DEPLOY_TOKEN' | docker login -u '$DEPLOY_TOKEN_USER' --password-stdin '$CI_REGISTRY'"

    # Deploy config files + ops scripts (single tar transfer instead of multiple SCP).
    # scripts/backup-s3.sh is referenced by the daily root crontab on prod — sync it
    # so the prod copy never drifts from repo.
    - |
      tar czf /tmp/deploy-configs.tar.gz \
        docker-compose.prod.yml nginx.prod.conf docker/ \
        scripts/backup-s3.sh scripts/restore-s3.sh scripts/validate-production-env.sh \
        scripts/run-production-migrations.sh \
        scripts/check-production-rollback.sh
    - scp -i $SSH_PRIVATE_KEY /tmp/deploy-configs.tar.gz root@$DEPLOY_HOST:/tmp/deploy-configs.tar.gz
    - |
      ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST \
        "mkdir -p /opt/education-platform/docker /opt/education-platform/scripts && \
         tar xzf /tmp/deploy-configs.tar.gz -C /opt/education-platform/ && \
         chmod +x /opt/education-platform/scripts/backup-s3.sh \
           /opt/education-platform/scripts/restore-s3.sh \
           /opt/education-platform/scripts/validate-production-env.sh \
           /opt/education-platform/scripts/run-production-migrations.sh \
           /opt/education-platform/scripts/check-production-rollback.sh && \
         rm /tmp/deploy-configs.tar.gz"

    # Export secrets from Infisical to .env
    - |
      printf '%s\n%s\n%s\n' \
        "$INFISICAL_CLIENT_ID" "$INFISICAL_CLIENT_SECRET" "$INFISICAL_PROJECT_ID" | \
      ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST '
        set -e
        umask 077
        IFS= read -r INFISICAL_UNIVERSAL_AUTH_CLIENT_ID
        IFS= read -r INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET
        IFS= read -r INFISICAL_PROJECT_ID
        export INFISICAL_API_URL=http://localhost:8080
        export INFISICAL_UNIVERSAL_AUTH_CLIENT_ID INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET
        INFISICAL_TOKEN="$(infisical login --method=universal-auth --silent --plain)"
        export INFISICAL_TOKEN
        rm -f /opt/education-platform/.env.tmp
        infisical export --projectId="$INFISICAL_PROJECT_ID" --env=prod --format=dotenv \
          > /opt/education-platform/.env.tmp
        test -s /opt/education-platform/.env.tmp
        /opt/education-platform/scripts/validate-production-env.sh \
          /opt/education-platform/.env.tmp /opt/education-platform/.env
        chmod 600 /opt/education-platform/.env.tmp
        mv /opt/education-platform/.env.tmp /opt/education-platform/.env
      '

    # Backup databases (fail deploy if backup fails)
    - |
      ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST '
        set -a && . /opt/education-platform/.env && set +a &&
        BACKUP_FILE=/opt/education-platform/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql &&
        docker exec postgres pg_dumpall -U "$POSTGRES_USER" > "$BACKUP_FILE" &&
        test -s "$BACKUP_FILE" || { echo "Backup failed or empty"; exit 1; } &&
        ls -t /opt/education-platform/backups/pre-deploy-*.sql | tail -n +6 | xargs rm -f 2>/dev/null || true
      '

    # Persist immutable release metadata and deploy exact image tags
    - |
      ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST "
        set -e &&
        RELEASES_DIR=/opt/education-platform/releases &&
        mkdir -p \$RELEASES_DIR &&
        printf '%s\n' \
          'IMAGE_TAG=$CI_COMMIT_SHA' \
          'DOCKER_REGISTRY=$CI_REGISTRY_IMAGE/' \
          'RELEASE_COMMIT_SHA=$CI_COMMIT_SHA' \
          'RELEASE_PIPELINE_ID=$CI_PIPELINE_ID' \
          'MEDIA_BINDING_PROTOCOL=1' \
          \"RELEASED_AT=\$(date -u +%Y-%m-%dT%H:%M:%SZ)\" \
          > \$RELEASES_DIR/pending.env &&
        cd /opt/education-platform &&
        set -a &&
        . /opt/education-platform/.env &&
        . \$RELEASES_DIR/pending.env &&
        set +a &&
        { [ -n \"\$POSTGRES_USER\" ] && [ -n \"\$POSTGRES_PASSWORD\" ]; } || { echo 'FATAL #642: POSTGRES_USER/POSTGRES_PASSWORD empty after sourcing .env (infisical export hiccup?) — aborting deploy before it bricks postgres' ; exit 1 ; } &&
        docker compose -f docker-compose.prod.yml pull \
          auth-service education-service file-service progress-service comment-service tag-service search-service access-service material-processing-service notification-service telegram-bot-service trainer-service assignment-review-service frontend \
          auth-service-migrations education-service-migrations file-service-migrations progress-service-migrations comment-service-migrations tag-service-migrations search-service-migrations access-service-migrations material-processing-service-migrations notification-service-migrations telegram-bot-service-migrations trainer-service-migrations assignment-review-service-migrations &&
        ./scripts/run-production-migrations.sh docker-compose.prod.yml \$RELEASES_DIR/current.env &&
        docker compose -f docker-compose.prod.yml up -d --force-recreate &&
        docker image prune -f &&
        if [ -f \$RELEASES_DIR/current.env ]; then cp \$RELEASES_DIR/current.env \$RELEASES_DIR/previous.env; fi &&
        mv \$RELEASES_DIR/pending.env \$RELEASES_DIR/current.env &&
        echo \"Current release tag: \$IMAGE_TAG\"
      "

    # Verify deployment — wait for all backend services to become healthy
    - |
      echo "Verifying deployment..."
            # telegram-bot-service ИСКЛЮЧЁН из EXPECTED_SERVICES — на проде Telegram API
      # частично блокируется (RU ISP), бот может несколько минут не входить в
      # healthy state (или вообще не входить если api.telegram.org недостижим).
      # Не блокируем deploy на нём — он стартует/рестартует сам, второстепенный.
      EXPECTED_SERVICES="education-service file-service progress-service comment-service tag-service search-service access-service material-processing-service notification-service auth-service trainer-service assignment-review-service frontend"
      EXPECTED_COUNT=$(echo $EXPECTED_SERVICES | wc -w | tr -d ' ')
      for attempt in $(seq 1 36); do
        healthy=$(ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST \
          "docker ps --filter health=healthy --format '{{.Names}}'" \
          | grep -cE "($(echo $EXPECTED_SERVICES | tr ' ' '|'))" || true)
        if [ "$healthy" -ge "$EXPECTED_COUNT" ]; then
          echo "All $EXPECTED_COUNT services healthy"
          # Check observability stack (warning only, not blocking)
          otel_running=$(ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST \
            "docker inspect --format='{{.State.Running}}' otel-collector 2>/dev/null || echo 'false'")
          echo "otel-collector running: $otel_running"
          [ "$otel_running" != "true" ] && echo "WARNING: otel-collector is not running — monitoring may not work"
          echo "Running public smoke checks..."
          wget --spider --tries=1 --timeout=10 "$CI_ENVIRONMENT_URL/" || exit 1
          wget --spider --tries=1 --timeout=10 "$CI_ENVIRONMENT_URL/sitemap.xml" || exit 1
          wget -qO /tmp/oidc.json "$CI_ENVIRONMENT_URL/.well-known/openid-configuration" || exit 1
          grep -q '"issuer"' /tmp/oidc.json || { echo "OIDC discovery response is invalid"; exit 1; }
          exit 0
        fi
        echo "  attempt $attempt/36 — $healthy/$EXPECTED_COUNT healthy, waiting 10s..."
        sleep 10
      done
      echo "DEPLOY VERIFICATION FAILED: not all services healthy after 6 minutes"
      ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST \
        "docker ps --format 'table {{.Names}}\t{{.Status}}'"
      exit 1
  # Images build automatically on every main push; production rollout is an
  # explicit owner click (#1153). tag-release `needs` this job and waits for it.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
    url: https://sachkov-learn.net

# Auto-create the SemVer git tag (+ GitLab Release) after a successful prod deploy.
# Version comes from the top released CHANGELOG entry. Idempotent: skips if the tag
# already exists. Uses CI_JOB_TOKEN (no extra credentials). Fixes #345 — previously
# tags were created by hand (v1.11.1, v1.12.0 were never auto-tagged).
tag-release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: deploy-production
      artifacts: false
  before_script:
    - apk add --no-cache curl git grep
  script:
    - |
      VERSION=$(grep -m1 -oE '## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
      if [ -z "$VERSION" ]; then echo "Could not parse a released version from CHANGELOG.md — skipping tag"; exit 0; fi
      TAG="v$VERSION"
      echo "Top released CHANGELOG version: $VERSION → tag $TAG"
      CODE=$(curl -s -o /dev/null -w "%{http_code}" --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags/$TAG")
      if [ "$CODE" = "200" ]; then echo "Tag $TAG already exists — nothing to do"; exit 0; fi
      release-cli create \
        --tag-name "$TAG" \
        --ref "$CI_COMMIT_SHA" \
        --name "$TAG" \
        --description "Automated release $TAG — see CHANGELOG.md [$VERSION]."
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

rollback-production:
  stage: deploy
  interruptible: false
  timeout: 10m
  when: manual
  image: alpine:latest
  before_script:
    - *prod-ssh-route
  script:
    - |
      echo "Rolling back to previous immutable release..."
      ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST "
        set -e &&
        RELEASES_DIR=/opt/education-platform/releases &&
        test -f \$RELEASES_DIR/current.env || { echo 'Current release metadata is missing'; exit 1; } &&
        test -f \$RELEASES_DIR/previous.env || { echo 'Previous release metadata is missing'; exit 1; } &&
        /opt/education-platform/scripts/check-production-rollback.sh \
          \$RELEASES_DIR/current.env \$RELEASES_DIR/previous.env \$RELEASES_DIR/pending.env &&
        cp \$RELEASES_DIR/previous.env \$RELEASES_DIR/rollback.env &&
        cd /opt/education-platform &&
        set -a &&
        . /opt/education-platform/.env &&
        . \$RELEASES_DIR/rollback.env &&
        set +a &&
        { [ -n \"\$POSTGRES_USER\" ] && [ -n \"\$POSTGRES_PASSWORD\" ]; } || { echo 'FATAL #642: POSTGRES_USER/POSTGRES_PASSWORD empty after sourcing .env (infisical export hiccup?) — aborting deploy before it bricks postgres' ; exit 1 ; } &&
        docker compose -f docker-compose.prod.yml pull \
          auth-service education-service file-service progress-service comment-service tag-service search-service access-service material-processing-service notification-service telegram-bot-service trainer-service assignment-review-service frontend \
          auth-service-migrations education-service-migrations file-service-migrations progress-service-migrations comment-service-migrations tag-service-migrations search-service-migrations access-service-migrations material-processing-service-migrations notification-service-migrations telegram-bot-service-migrations trainer-service-migrations assignment-review-service-migrations &&
        docker compose -f docker-compose.prod.yml up -d --force-recreate &&
        docker image prune -f &&
        mv \$RELEASES_DIR/current.env \$RELEASES_DIR/rolled-back-from.env &&
        mv \$RELEASES_DIR/rollback.env \$RELEASES_DIR/current.env &&
        mv \$RELEASES_DIR/rolled-back-from.env \$RELEASES_DIR/previous.env &&
        echo \"Rolled back to image tag: \$IMAGE_TAG\"
      "
    - |
      echo "Verifying rollback..."
            # telegram-bot-service ИСКЛЮЧЁН из EXPECTED_SERVICES — на проде Telegram API
      # частично блокируется (RU ISP), бот может несколько минут не входить в
      # healthy state (или вообще не входить если api.telegram.org недостижим).
      # Не блокируем deploy на нём — он стартует/рестартует сам, второстепенный.
      EXPECTED_SERVICES="education-service file-service progress-service comment-service tag-service search-service access-service material-processing-service notification-service auth-service trainer-service assignment-review-service frontend"
      EXPECTED_COUNT=$(echo $EXPECTED_SERVICES | wc -w | tr -d ' ')
      for attempt in $(seq 1 12); do
        healthy=$(ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST \
          "docker ps --filter health=healthy --format '{{.Names}}'" \
          | grep -cE "($(echo $EXPECTED_SERVICES | tr ' ' '|'))" || true)
        if [ "$healthy" -ge "$EXPECTED_COUNT" ]; then
          echo "Rollback successful — all $EXPECTED_COUNT services healthy"
          echo "Running public smoke checks after rollback..."
          wget --spider --tries=1 --timeout=10 "$CI_ENVIRONMENT_URL/" || exit 1
          wget -qO /tmp/oidc.json "$CI_ENVIRONMENT_URL/.well-known/openid-configuration" || exit 1
          grep -q '"issuer"' /tmp/oidc.json || { echo "OIDC discovery response is invalid after rollback"; exit 1; }
          exit 0
        fi
        echo "  attempt $attempt/12 — $healthy/$EXPECTED_COUNT healthy, waiting 10s..."
        sleep 10
      done
      echo "ROLLBACK VERIFICATION FAILED"
      ssh -i $SSH_PRIVATE_KEY root@$DEPLOY_HOST \
        "docker ps --format 'table {{.Names}}\t{{.Status}}'"
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  environment:
    name: production
    action: stop
    url: https://sachkov-learn.net
