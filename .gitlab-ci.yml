# ───── BUILD ─────
#
# Все build-* джобы билдятся БЕЗУСЛОВНО на main (без `changes:`-гейта). Раньше большинство
# было gated по `backend/<Svc>/**` + `Shared/**`, но release-MR merge-коммиты в main имеют
# пустой diff против ближайшего родителя (pre-merge release-ветка), поэтому `changes:` НЕ
# матчился → build-джоба скипалась → `prepare-release-images` re-tag'ал stale `<svc>:latest`
# под свежий `:$CI_COMMIT_SHA` → прод катил бинарь старее своего тега (issue #661: access/
# notification/progress/material-processing гоняли код 06-23 под тегом v1.46.1). ARS и trainer
# уже были безусловными по этой же причине. `--cache-from :latest` держит unchanged-билды
# быстрыми (полный layer-cache hit); `--build-arg BUILD_REVISION=$CI_COMMIT_SHA` штампует
# коммит в image-label, чтобы staleness была видна сразу (`docker inspect` revision vs git).

build-auth-service:
  extends: .docker-build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - *nuget-config
    - |
      docker build \
        --build-arg BUILD_REVISION=$CI_COMMIT_SHA \
        --build-arg BUILD_VERSION=$CI_COMMIT_SHORT_SHA \
        --secret id=nuget_config,src=backend/nuget.config \
        --cache-from $CI_REGISTRY_IMAGE/auth-service:latest \
        --file backend/AuthService/Dockerfile \
        --tag $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHA \
        --tag $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHORT_SHA \
        --tag $CI_REGISTRY_IMAGE/auth-service:latest \
        backend
    - docker push $CI_REGISTRY_IMAGE/auth-service --all-tags

