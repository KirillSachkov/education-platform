events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # OpenIddict tokens + NextAuth session cookies can be large
    large_client_header_buffers 4 32k;

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # Enable when SSL termination is configured:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Defence-in-depth: block external access to /internal/* (S2S endpoints
        # behind RequireAnyRole(SERVICE, ADMIN)). Belt-and-braces — they're
        # already unreachable through this proxy, but explicit deny prevents
        # accidental exposure if a future location block widens the surface.
        location ~ ^/internal/ {
            return 403;
        }

        # Access Service
        location /api/access/ {
            set $upstream_access http://access-service:8010;
            rewrite ^/api/access/(.*) /access/$1 break;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Assignment Review Service (AI-проверка студенческих PR на GitHub)
        location = /api/assignment-review {
            return 301 /api/assignment-review/;
        }

        location /api/assignment-review/ {
            set $upstream_assignment_review http://assignment-review-service:8012;
            rewrite ^/api/assignment-review/(.*) /assignment-review/$1 break;
            proxy_pass $upstream_assignment_review;
            # run-iteration выполняет синхронный LLM-вызов (reasoning-модель, до неск. минут).
            # Дефолтные 60s рубят запрос и вместе с ним ct → review.llm.unavailable (#337).
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Comment Service
        location /api/comments/ {
            set $upstream_comment http://comment-service:8004;
            rewrite ^/api/comments/(.*) /comments/$1 break;
            proxy_pass $upstream_comment;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification Service — short click-through proxy link for email/Telegram.
        # Пример: {frontendBaseUrl}/n/{id} → mark-as-read → 302 на target URL.
        # Обязан быть ВЫШЕ catch-all /, иначе улетает в Next.js → 404.
        location ^~ /n/ {
            set $upstream_notification http://notification-service:8006;
            proxy_pass $upstream_notification;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Notification Service — SSE stream (must come before /api/notifications/)
        location ^~ /api/notifications/stream {
            # SSE JWT идёт query-параметром access_token (#457, нативный EventSource не
            # шлёт headers) — отключаем access_log, чтобы токен не попадал в логи nginx.
            access_log off;
            set $upstream_notification http://notification-service:8006;
            rewrite ^/api/notifications/(.*) /notifications/$1 break;
            proxy_pass $upstream_notification;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Notification Service
        location /api/notifications/ {
            set $upstream_notification http://notification-service:8006;
            rewrite ^/api/notifications/(.*) /notifications/$1 break;
            proxy_pass $upstream_notification;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Education Content Service
        location /api/modules/ {
            set $upstream_education http://education-service:8001;
            rewrite ^/api/modules/(.*) /modules/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/courses/ {
            set $upstream_education http://education-service:8001;
            rewrite ^/api/courses/(.*) /courses/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/materials/ {
            set $upstream_education http://education-service:8001;
            rewrite ^/api/materials/(.*) /materials/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/projects/ {
            set $upstream_education http://education-service:8001;
            rewrite ^/api/projects/(.*) /projects/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/issues/ {
            set $upstream_education http://education-service:8001;
            rewrite ^/api/issues/(.*) /issues/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/authors/ {
            set $upstream_education http://education-service:8001;
            rewrite ^/api/authors/(.*) /authors/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/collections/ {
            set $upstream_education http://education-service:8001;
            rewrite ^/api/collections/(.*) /collections/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/quizzes/ {
            set $upstream_education http://education-service:8001;
            rewrite ^/api/quizzes/(.*) /quizzes/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # File Service
        location /api/files/ {
            set $upstream_file http://file-service:8002;
            rewrite ^/api/files/(.*) /files/$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/videos/ {
            set $upstream_file http://file-service:8002;
            rewrite ^/api/videos/(.*) /videos/$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/draft-assets/ {
            set $upstream_file http://file-service:8002;
            rewrite ^/api/draft-assets/(.*) /draft-assets/$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/assets/ {
            set $upstream_file http://file-service:8002;
            rewrite ^/api/assets/(.*) /assets/$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/webhooks/kinescope {
            set $upstream_file http://file-service:8002;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service — OIDC discovery
        # When running auth-service locally (not in Docker), change to:
        #   set $upstream_auth http://host.docker.internal:8005;
        location /.well-known/ {
            set $upstream_auth http://auth-service:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service — OpenIddict connect endpoints
        location /connect/ {
            set $upstream_auth http://auth-service:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service — custom auth endpoints (OTP, login, register, GitHub)
        location /auth/ {
            set $upstream_auth http://auth-service:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service — user profiles
        location /api/users/ {
            set $upstream_auth http://auth-service:8005;
            rewrite ^/api/users/(.*) /users/$1 break;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Progress Service
        location /api/progress/ {
            set $upstream_progress http://progress-service:8003;
            rewrite ^/api/progress/(.*) /progress/$1 break;
            proxy_pass $upstream_progress;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Material Processing Service (transcription + AI synopsis + timecodes)
        location /api/material-processing/ {
            set $upstream_material_processing http://material-processing-service:8011;
            rewrite ^/api/material-processing/(.*) /material-processing/$1 break;
            proxy_pass $upstream_material_processing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Telegram Bot Service — admin endpoints (chat-binding management)
        location /api/telegram/ {
            set $upstream_telegram http://telegram-bot-service:8008;
            rewrite ^/api/telegram/(.*) /telegram/$1 break;
            proxy_pass $upstream_telegram;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenTelemetry Collector (OTLP HTTP), optional in dev
        location /api/otlp/ {
            set $upstream_otel http://otel-collector:4318;
            rewrite ^/api/otlp/(.*) /$1 break;
            proxy_pass $upstream_otel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (dev) — proxy directly to the frontend container.
        # This avoids Docker host networking edge-cases in WSL/Linux setups.
        location / {
            set $upstream_frontend http://frontend:3000;
            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # NextAuth session cookies can be large (chunked)
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            # WebSocket support for HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # MinIO Storage
        location /storage/ {
            set $upstream_minio http://minio:9000;
            rewrite ^/storage/(.*) /$1 break;
            proxy_pass $upstream_minio;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "";

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            proxy_request_buffering off;
            client_max_body_size 0;
        }
    }
}
