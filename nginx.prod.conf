events {
    worker_connections 1024;
}

http {
    # Error log for fail2ban integration
    error_log /var/log/nginx/error.log warn;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # OpenIddict tokens + NextAuth session cookies can be large
    large_client_header_buffers 4 32k;

    # Default request body limit (overridden per-location where needed)
    client_max_body_size 1m;

    # Timeouts — protect against slowloris and slow-client attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Rate limiting
    #
    # Docker-internal traffic (e.g. NextAuth on frontend container hitting
    # /connect/token через https://sachkov-learn.net/) приходит с одним
    # IP 172.18.0.x. Если использовать $binary_remote_addr как ключ —
    # вся серверная NextAuth-нагрузка от ВСЕХ юзеров режется одним ведром
    # → 429 при concurrent логинах → CallbackRouteError на фронте.
    #
    # Решение: $limit_key — пустая строка для Docker network (172.16.0.0/12
    # включает default bridge 172.17 + compose default 172.18 + user-defined),
    # обычный IP для внешнего трафика. Пустой ключ полностью отключает
    # rate-limit для записи (см. nginx ngx_http_limit_req_module docs).
    geo $is_docker_internal {
        default 0;
        172.16.0.0/12 1;
    }
    map $is_docker_internal $limit_key {
        0 $binary_remote_addr;
        1 "";
    }
    limit_req_zone $limit_key zone=api:10m rate=30r/s;
    limit_req_zone $limit_key zone=auth:10m rate=5r/s;
    # Frontend (Next.js SPA) — page shell + RSC prefetch (?_rsc=) + browser NextAuth
    # /api/auth/session polling fire in bursts of tens of requests per navigation. The
    # api zone (30r/s) is sized for backend API calls, not SPA traffic, so location /
    # 503'd legit navigation + session polling under normal use (issue #373).
    limit_req_zone $limit_key zone=frontend:10m rate=100r/s;

    # Return 429 (retryable) instead of nginx's default 503 when a zone throttles — 503
    # falsely reads as "server down" and trips client error handling (e.g. NextAuth).
    limit_req_status 429;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 100;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Redirect HTTP to HTTPS (external traffic only)
    server {
        listen 80;
        server_name sachkov-learn.net;

        # Defence-in-depth: explicitly deny external access to /internal/* paths.
        # These are S2S-only endpoints (RequireAnyRole SERVICE/ADMIN); without this
        # block they're unreachable only by virtue of no matching location, which
        # is whitelist-by-omission. Belt-and-braces.
        location ~ ^/internal/ {
            return 403;
        }

        # ACME HTTP-01 challenge (Let's Encrypt certbot --webroot). MUST precede the
        # /.well-known/ proxy below — `^~` is a non-regex prefix match that wins over it
        # so acme-challenge files are served statically over plain HTTP (no https redirect,
        # no auth-service proxy). Webroot dir mounted from ./certbot-webroot (docker-compose.prod.yml).
        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /var/www/certbot;
        }

        # Internal Docker traffic — proxy auth endpoints with X-Forwarded-Proto: https
        # so OpenIddict sees HTTPS scheme. Used by frontend (NextAuth) and backend services.
        location /.well-known/ {
            if ($is_docker_internal = 0) {
                return 308 https://sachkov-learn.net$request_uri;
            }
            set $upstream_auth http://auth-service:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host sachkov-learn.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /connect/ {
            if ($is_docker_internal = 0) {
                return 308 https://sachkov-learn.net$request_uri;
            }
            set $upstream_auth http://auth-service:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host sachkov-learn.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /auth/ {
            if ($is_docker_internal = 0) {
                return 308 https://sachkov-learn.net$request_uri;
            }
            set $upstream_auth http://auth-service:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host sachkov-learn.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/users/ {
            if ($is_docker_internal = 0) {
                return 308 https://sachkov-learn.net$request_uri;
            }
            set $upstream_auth http://auth-service:8005;
            rewrite ^/api/users/(.*) /users/$1 break;
            proxy_pass $upstream_auth;
            proxy_set_header Host sachkov-learn.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Everything else gets redirected to HTTPS
        location / {
            return 301 https://sachkov-learn.net$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name sachkov-learn.net;

        ssl_certificate /etc/letsencrypt/live/sachkov-learn.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sachkov-learn.net/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 1h;
        ssl_session_cache shared:SSL:10m;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Defence-in-depth: block external access to /internal/* (S2S endpoints).
        # Same rationale as the port 80 block above.
        location ~ ^/internal/ {
            return 403;
        }

        # Cache static assets served by Next.js
        location /_next/static/ {
            set $upstream_frontend http://frontend:3000;
            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Frontend (Next.js)
        location / {
            limit_req zone=frontend burst=200 nodelay;
            set $upstream_frontend http://frontend:3000;
            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # NextAuth callback sets large cookies (JWT + session)
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Rate limit API endpoints
        # Auth endpoints get stricter limits (login/register brute-force protection)

        # Comment Service
        location /api/comments/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_comment http://comment-service:8004;
            rewrite ^/api/comments/(.*) /comments/$1 break;
            proxy_pass $upstream_comment;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Tag Service
        location /api/tags/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_tag http://tag-service:8007;
            rewrite ^/api/tags/(.*) /tags/$1 break;
            proxy_pass $upstream_tag;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification Service — short click-through proxy link for email/Telegram.
        # Пример: https://sachkov-learn.net/n/{id} → mark-as-read → 302 на target URL.
        # Обязан быть ВЫШЕ catch-all /, иначе улетает в Next.js → 404.
        location ^~ /n/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_notification http://notification-service:8006;
            proxy_pass $upstream_notification;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Notification Service — SSE stream (must come before /api/notifications/)
        location ^~ /api/notifications/stream {
            # SSE JWT идёт query-параметром access_token (#457, нативный EventSource не
            # шлёт headers) — отключаем access_log, чтобы токен не попадал в логи nginx.
            access_log off;
            set $upstream_notification http://notification-service:8006;
            rewrite ^/api/notifications/(.*) /notifications/$1 break;
            proxy_pass $upstream_notification;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Notification Service
        location /api/notifications/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_notification http://notification-service:8006;
            rewrite ^/api/notifications/(.*) /notifications/$1 break;
            proxy_pass $upstream_notification;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Education Content Service
        location /api/modules/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/modules/(.*) /modules/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/roadmaps/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/roadmaps/(.*) /roadmaps/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/courses/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/courses/(.*) /courses/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/materials/ {
            limit_req zone=api burst=50 nodelay;
            client_max_body_size 10m;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/materials/(.*) /materials/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/authors/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/authors/(.*) /authors/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/collections/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/collections/(.*) /collections/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/quizzes/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/quizzes/(.*) /quizzes/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/short-links/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/short-links/(.*) /short-links/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Education Content Service — короткая share-ссылка материала /s/{code} (#507).
        # Пример: https://sachkov-learn.net/s/Ab3xY9zQ → 302 → /knowledge-base/{materialId}.
        # Обязан быть ВЫШЕ catch-all /, иначе улетает в Next.js → 404.
        location ^~ /s/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/s/([0-9A-Za-z]+)/?$ /short-links/$1/resolve break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/projects/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/projects/(.*) /projects/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/issues/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_education http://education-service:8001;
            rewrite ^/api/issues/(.*) /issues/$1 break;
            proxy_pass $upstream_education;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Search Service
        location = /api/search {
            return 301 /api/search/;
        }

        location /api/search/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_search http://search-service:8009;
            rewrite ^/api/search/$ /search break;
            rewrite ^/api/search/(.*) /search/$1 break;
            proxy_pass $upstream_search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Access Service
        location /api/access/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_access http://access-service:8010;
            rewrite ^/api/access/(.*) /access/$1 break;
            proxy_pass $upstream_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Trainer Service (interview-prep drill trainer)
        location /api/trainer/ {
            limit_req zone=api burst=50 nodelay;
            # Voice answers (#663): ~3 min opus audio ≈ a few MB — the global 1m cap (line ~20) would
            # 413 the upload before it reaches the service (which itself caps audio at 8 MiB). Sit above
            # the service cap so an oversized file gets the friendly app-level message, not a raw 413.
            client_max_body_size 25m;
            set $upstream_trainer http://trainer-service:8013;
            rewrite ^/api/trainer/(.*) /trainer/$1 break;
            proxy_pass $upstream_trainer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Assignment Review Service (AI-проверка студенческих PR на GitHub)
        location = /api/assignment-review {
            return 301 /api/assignment-review/;
        }

        location /api/assignment-review/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_assignment_review http://assignment-review-service:8012;
            rewrite ^/api/assignment-review/(.*) /assignment-review/$1 break;
            proxy_pass $upstream_assignment_review;
            # run-iteration выполняет синхронный LLM-вызов (reasoning-модель, до неск. минут).
            # Дефолтные 60s рубят запрос и вместе с ним ct → review.llm.unavailable (#337).
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # File Service
        location /api/files/ {
            limit_req zone=api burst=50 nodelay;
            client_max_body_size 100m;
            set $upstream_file http://file-service:8002;
            rewrite ^/api/files/(.*) /files/$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Yandex Object Storage (S3) — reverse-proxy presigned URLs through our own
        # origin. FileService answers GET /api/files/{id}/content with a 302 to a
        # presigned URL; with FileStorageOptions:ExternalEndpoint set, that URL is
        # rewritten to https://sachkov-learn.net/storage/... so the browser fetches
        # file bytes from this domain (already reachable — the page loaded) instead
        # of connecting directly to storage.yandexcloud.net. Some clients (abroad /
        # certain RU ISP routes) can't reach Yandex Cloud and got
        # ERR_CONNECTION_TIMED_OUT on the cross-origin <img> redirect (#424).
        # Path-style addressing (ForcePathStyle=true) keeps the bucket in the path,
        # so the upstream Host stays storage.yandexcloud.net and the SigV4 signature
        # (signed over Host) remains valid after the host rewrite. The signature
        # query string is preserved by nginx automatically.
        location /storage/ {
            set $upstream_yandex https://storage.yandexcloud.net;
            rewrite ^/storage/(.*) /$1 break;
            proxy_pass $upstream_yandex;
            proxy_set_header Host storage.yandexcloud.net;
            proxy_ssl_server_name on;
            proxy_ssl_name storage.yandexcloud.net;
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            proxy_request_buffering off;
            client_max_body_size 0;
        }

        location /api/videos/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_file http://file-service:8002;
            rewrite ^/api/videos/(.*) /videos/$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/draft-assets/ {
            limit_req zone=api burst=50 nodelay;
            client_max_body_size 100m;
            set $upstream_file http://file-service:8002;
            rewrite ^/api/draft-assets/(.*) /draft-assets/$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/assets/ {
            limit_req zone=api burst=50 nodelay;
            client_max_body_size 100m;
            set $upstream_file http://file-service:8002;
            rewrite ^/api/assets/(.*) /assets/$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/webhooks/kinescope {
            limit_req zone=api burst=5 nodelay;
            set $upstream_file http://file-service:8002;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $upstream_file;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service — OIDC discovery
        location /.well-known/ {
            set $upstream_auth http://auth-service:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service — OpenIddict connect endpoints
        location /connect/ {
            limit_req zone=auth burst=10 nodelay;
            set $upstream_auth http://auth-service:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service — custom auth endpoints (OTP, login, register, GitHub)
        location /auth/ {
            limit_req zone=auth burst=10 nodelay;
            set $upstream_auth http://auth-service:8005;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service — user profiles
        location /api/users/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_auth http://auth-service:8005;
            rewrite ^/api/users/(.*) /users/$1 break;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Progress Service
        location /api/progress/ {
            limit_req zone=api burst=50 nodelay;
            set $upstream_progress http://progress-service:8003;
            rewrite ^/api/progress/(.*) /progress/$1 break;
            proxy_pass $upstream_progress;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Material Processing Service (transcription + AI synopsis + timecodes)
        location /api/material-processing/ {
            limit_req zone=api burst=20 nodelay;
            set $upstream_material_processing http://material-processing-service:8011;
            rewrite ^/api/material-processing/(.*) /material-processing/$1 break;
            proxy_pass $upstream_material_processing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Telegram Bot Service — admin endpoints (chat-binding management)
        location /api/telegram/ {
            limit_req zone=api burst=20 nodelay;
            set $upstream_telegram http://telegram-bot-service:8008;
            rewrite ^/api/telegram/(.*) /telegram/$1 break;
            proxy_pass $upstream_telegram;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
